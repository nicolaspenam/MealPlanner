name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pages:bundle
      - name: Commit Pages bundle for branch deploys
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets 404.html .nojekyll favicon.svg apple-touch-icon.png pwa-192.png pwa-512.png manifest.webmanifest sw.js
          git add workbox-*.js 2>/dev/null || true
          git add -u -- workbox-*.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Pages bundle is already up to date"
          else
            git commit -m "Publish GitHub Pages assets [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
