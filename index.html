<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6f4e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meals" />
    <meta name="description" content="Plan weekly meals and curate grocery lists on your device." />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Meal Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      if (location.hostname.endsWith("github.io")) {
        const stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = "./assets/app.css";
        document.head.appendChild(stylesheet);
        const script = document.createElement("script");
        script.type = "module";
        script.src = "./assets/app.js";
        document.body.appendChild(script);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
